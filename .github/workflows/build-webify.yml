name: Build Webify APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Setup Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Provisioning toolchain on-device (aapt2 + android.jar)
        run: chmod +x scripts/prepare_toolchain.sh && ./scripts/prepare_toolchain.sh

      - name: Siapkan keystore rilis dari secrets (opsional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WEBIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/webify-release.jks"
            echo "file=$RUNNER_TEMP/webify-release.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore rilis ditemukan — build release akan ditandatangani dengan kunci rilis."
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "::notice::WEBIFY_KEYSTORE_BASE64 tidak di-set — release APK ditandatangani debug key."
          fi

      - name: Assemble Debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Assemble Release
        env:
          WEBIFY_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          WEBIFY_KEYSTORE_PASSWORD: ${{ secrets.WEBIFY_KEYSTORE_PASSWORD }}
          WEBIFY_KEY_ALIAS: ${{ secrets.WEBIFY_KEY_ALIAS }}
          WEBIFY_KEY_PASSWORD: ${{ secrets.WEBIFY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Kumpulkan APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Webify-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/Webify-release.apk
          ls -lh dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/Webify-release.apk | head -n 5 || true

      - name: Upload Webify-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: Webify-debug
          path: dist/Webify-debug.apk
          retention-days: 30

      - name: Upload Webify-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Webify-release
          path: dist/Webify-release.apk
          retention-days: 30

      - name: GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Webify ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Webify-debug.apk
            dist/Webify-release.apk
